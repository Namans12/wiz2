[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizlight"
dynamic = ["version"]
description = "Advanced WiZ smart light controller with screen sync and clap detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Naman"}
]
dependencies = [
    "pywizlight>=0.5.14,<0.7",
    "click>=8.0,<9",
    "mss>=9.0,<11",
    "Pillow>=10.0,<13",
    "customtkinter>=5.0,<6",
    "sounddevice>=0.4,<0.6",
    "numpy>=1.24,<3",
    "pystray>=0.19,<0.20",
    "dxcam[winrt]>=0.3.0,<0.4; sys_platform == 'win32'",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-asyncio>=0.21,<2",
    "ruff>=0.4,<0.12",
    "opencv-python>=4.8,<5",
    "pyinstaller>=6.0,<7",
]
calibration = [
    "opencv-python>=4.8,<5",
]
package = [
    "pyinstaller>=6.0,<7",
]

[project.scripts]
wizlight = "src.cli.commands:cli"

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Capture at the sys level, not the file-descriptor level.  The GUI test modules each create a
# Tk interpreter; pytest's fd capture re-points fds 0-2 between test phases, which closes the
# Win32 handles Tcl keeps for its standard channels.  A later interpreter can then get a
# recycled handle and fail to read its own init.tcl/tk.tcl ("couldn't read file ... No error"),
# intermittently when the machine is busy.
addopts = "--capture=sys"
markers = [
    "hardware: tests that control real bulbs, cameras, or local network devices",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "clap_detector.py",
    "color_mapping.py",
    "fast_udp_sender.py",
    "screen_sync.py",
    "screen_sync_v2.py",
    "wizlight-android",
]
