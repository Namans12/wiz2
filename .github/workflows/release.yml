name: Release

# Tag push (vX.Y.Z)  -> build everything and publish a GitHub Release.
# workflow_dispatch  -> build only, artifacts are kept for 14 days.
# pull_request       -> build only, when packaging or release files change, so release
#                       changes can be tested from a PR without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "wizlight-android/android/**"
      - "wizlight-android/pubspec.yaml"
      - "requirements*.txt"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check it against the tag
        id: v
        shell: bash
        run: |
          version="$(python3 packaging/version_tools.py --print | tail -n 1)"
          pubspec="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' wizlight-android/pubspec.yaml | head -n 1)"
          echo "src/__init__.py: $version"
          echo "pubspec.yaml:    $pubspec"
          if [ "$version" != "$pubspec" ]; then
            echo "::error::src/__init__.py ($version) and wizlight-android/pubspec.yaml ($pubspec) disagree. Run scripts/bump_version.py."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            # Allow pre-release suffixes on the tag (v1.2.0-rc1 releases version 1.2.0).
            base="${tag%%-*}"
            if [ "$base" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match src/__init__.py version $version."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (portable zip + installer)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/WizLight-${{ needs.version.outputs.version }}-portable.zip" release/
          Copy-Item "dist/installer/WizLight-${{ needs.version.outputs.version }}-Setup.exe" release/
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} (unsigned DMG)
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: intel
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          brew install create-dmg
      - name: Build
        env:
          PYTHON: python
        run: bash packaging/build_macos.sh
      - name: Check the bundle
        run: |
          app="dist/WizLight.app"
          file "$app/Contents/MacOS/WizLight"
          codesign -dv "$app" 2>&1 || true
          plutil -p "$app/Contents/Info.plist" | grep -E "CFBundleShortVersionString|NSMicrophone"
      - name: Collect artifacts
        run: |
          mkdir release
          cp "dist/WizLight-${{ needs.version.outputs.version }}-macOS.dmg" \
             "release/WizLight-${{ needs.version.outputs.version }}-macOS-${{ matrix.arch }}.dmg"
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizlight-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare release signing
        shell: bash
        # Secrets are only exposed outside pull_request runs, so PR builds are always debug-signed.
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release keystore configured."
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning title=PR build: debug-signed by design::Pull request builds never use the release key. The APK is signed with the debug key."
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "::error title=Release key missing::A tagged release must be signed with the release key, but the ANDROID_* signing secrets are not all set. See docs/releasing.md."
            exit 1
          else
            echo "::warning title=No keystore secret: debug-signed::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets are not all set, so the APK is signed with the debug key. Updates will not install over an APK signed with a different key. See docs/releasing.md."
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name and verify the APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          apk="$GITHUB_WORKSPACE/release/WizLight-${{ needs.version.outputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk" | head -n 3
          ls -lh "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Install

          Pick the file for your platform. Verify downloads against `SHA256SUMS.txt`.

          | Platform | File |
          | --- | --- |
          | Windows installer | `WizLight-<version>-Setup.exe` |
          | Windows portable | `WizLight-<version>-portable.zip` (unzip anywhere, run `WizLight.exe`) |
          | macOS, Apple Silicon | `WizLight-<version>-macOS-arm64.dmg` |
          | macOS, Intel | `WizLight-<version>-macOS-intel.dmg` |
          | Android | `WizLight-<version>.apk` |

          These builds are not code-signed by a paid certificate, so each OS shows a first-run warning.

          - **Windows:** SmartScreen shows "Windows protected your PC". Click **More info**, then **Run anyway**.
          - **macOS:** open the DMG and drag WizLight to Applications. The first launch is blocked. Open **System Settings > Privacy & Security**, scroll down and click **Open Anyway**. Then allow **Screen Recording** (screen sync) and **Microphone** (clap detection) when asked, and restart the app.
          - **Android:** allow **Install unknown apps** for your browser or file manager when prompted.

          ## Changes
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WizLight $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
